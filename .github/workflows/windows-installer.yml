name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

env:
  BUILD_DIR: ${{ runner.temp }}\openbabel-build
  DEPS_DIR: ${{ runner.temp }}\msvc-dependencies
  MAINTENANCE_DIR: ${{ runner.temp }}\openbabel-maintenance
  WXWIN: ${{ runner.temp }}\wxWidgets

jobs:
  windows-installer:
    runs-on: windows-2022

    steps:
      - name: Check out Open Babel
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa439dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Windows packaging tools
        shell: pwsh
        run: choco install nsis swig 7zip -y --no-progress

      - name: Fetch legacy Windows packaging assets
        shell: pwsh
        run: ./packaging/windows/Fetch-Maintenance.ps1

      - name: Fetch MSVC dependencies
        shell: pwsh
        run: ./packaging/windows/Fetch-Dependencies.ps1

      - name: Build wxWidgets 3.0.5 x64
        shell: pwsh
        run: ./packaging/windows/Build-WxWidgets.ps1

      - name: Download VC++ runtime
        shell: pwsh
        run: |
          $dist = "$env:MAINTENANCE_DIR\windows\for_dist"
          Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile "$dist\vc_redist.x64.exe"

      - name: Configure Open Babel
        shell: pwsh
        run: |
          $swig = (Get-Command swig.exe).Source

          cmake -S "$env:GITHUB_WORKSPACE" -B "$env:BUILD_DIR" `
            -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_INSTALL_PREFIX="$env:BUILD_DIR\install" `
            -DOB_USE_PREBUILT_BINARIES=ON `
            -DMINIMAL_BUILD=OFF `
            -DBUILD_GUI=ON `
            -DwxWidgets_ROOT_DIR="$env:WXWIN" `
            -DwxWidgets_LIB_DIR="$env:WX_LIB_DIR" `
            -DwxWidgets_CONFIGURATION=mswu `
            -DwxWidgets_USE_STATIC=OFF `
            -DLIBXML2_LIBRARIES="$env:DEPS_DIR\libs-common\x64\libxml2.lib" `
            -DLIBXML2_INCLUDE_DIR="$env:DEPS_DIR\include" `
            -DCAIRO_INCLUDE_DIRS="$env:DEPS_DIR\include\cairo" `
            -DCAIRO_LIBRARIES="$env:DEPS_DIR\libs-common\x64\cairo.lib" `
            -DZLIB_LIBRARY="$env:DEPS_DIR\libs-common\x64\zlib1.lib" `
            -DZLIB_INCLUDE_DIR="$env:DEPS_DIR\include" `
            -DXDR_LIBRARY="$env:DEPS_DIR\libs-common\x64\xdr.lib" `
            -DXDR_INCLUDE_DIR="$env:DEPS_DIR\include" `
            -DEIGEN3_INCLUDE_DIR="$env:DEPS_DIR\include" `
            -DJSON_LIBRARY="$env:DEPS_DIR\libs-vs12\x64\jsoncpp.lib" `
            -DRUN_SWIG=ON `
            -DSWIG_EXECUTABLE="$swig" `
            -DJAVA_BINDINGS=OFF `
            -DCSHARP_BINDINGS=OFF `
            -DWITH_INCHI=OFF `
            -DOPENBABEL_USE_SYSTEM_INCHI=OFF `
            -DENABLE_TESTS=OFF

      - name: Build Open Babel
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --config Release --parallel
          $gui = Get-ChildItem "$env:BUILD_DIR" -Filter obgui.exe -Recurse | Select-Object -First 1
          if ($null -eq $gui) { throw 'obgui.exe was not built.' }
          Write-Host "Built GUI: $($gui.FullName)"

      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/Build-Installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenBabel-${{ env.VERSION }}-x64-installer
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:INSTALLER" --generate-notes --title "Open Babel $env:VERSION"
